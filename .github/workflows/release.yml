name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Optional git ref to build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"
  UV_CACHE_DIR: .uv-cache

jobs:
  build:
    name: Build and audit distributions
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.13"

      - name: Install locked environment
        run: uv sync --frozen --group dev --config-file uv.toml

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(.venv/bin/python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
              exit 1
            fi
          fi
          .venv/bin/python .codex/skills/build-release/scripts/release_build.py \
            check-version --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check PyPI version is unused
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: >-
          .venv/bin/python .codex/skills/build-release/scripts/release_build.py
          check-pypi --version "${{ steps.version.outputs.version }}"

      - name: Validate migration package source
        if: steps.version.outputs.version == '0.1.0'
        run: >-
          .venv/bin/python scripts/redirect_release.py check-source
          --version "${{ steps.version.outputs.version }}"

      - name: Check migration package version is unused
        if: >-
          github.event_name == 'push' && github.ref_type == 'tag' &&
          steps.version.outputs.version == '0.1.0'
        run: >-
          .venv/bin/python .codex/skills/build-release/scripts/release_build.py
          check-pypi --package gradoom
          --version "${{ steps.version.outputs.version }}"

      - name: Run source checks
        run: |
          .venv/bin/ruff check .
          .venv/bin/pytest -q

      - name: Build and audit distributions
        run: >-
          .venv/bin/python .codex/skills/build-release/scripts/release_build.py
          build --version "${{ steps.version.outputs.version }}"
          --out-dir dist/primary

      - name: Build and audit migration distributions
        if: steps.version.outputs.version == '0.1.0'
        run: >-
          .venv/bin/python scripts/redirect_release.py build
          --version "${{ steps.version.outputs.version }}"
          --out-dir dist/redirect

      - name: Upload audited distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-v${{ steps.version.outputs.version }}
          path: dist/**
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/env-doom-turbo-torch
    permissions:
      id-token: write
    steps:
      - name: Download audited distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-v${{ needs.build.outputs.version }}
          path: dist

      - name: Publish primary package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/primary

      - name: Publish migration package distributions to PyPI
        if: needs.build.outputs.version == '0.1.0'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/redirect

  github-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - build
      - publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download audited distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-v${{ needs.build.outputs.version }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f -exec cp {} release-assets/ \;
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
