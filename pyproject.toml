[build-system]
requires = ["setuptools>=78,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "gradoom"
version = "0.1.0a1"
description = "GPU-native Doom reinforcement-learning environments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND GPL-3.0-only"
license-files = ["LICENSE", "LICENSES/GPL-3.0-only.txt", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Tiago Silva"}]
dependencies = [
  "gymnasium>=1.2,<2",
  "numpy>=1.26,<3",
  "torch>=2.12,<2.13",
  "wandb>=0.18,<0.23",
]

[dependency-groups]
dev = [
  "pygame-ce>=2.5,<3",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gradoom = ["assets/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "guardrails-ai!=0.10.1",
  "mistralai!=2.4.6",
]
