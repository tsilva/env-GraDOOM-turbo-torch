[build-system]
requires = ["setuptools>=83,<84", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "env-doom-turbo-torch"
version = "0.1.0"
description = "Torch-native Doom reinforcement-learning environments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND GPL-3.0-only"
license-files = ["LICENSE", "LICENSES/GPL-3.0-only.txt", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Tiago Silva"}]
dependencies = [
  "gymnasium>=1.2,<2",
  "numpy>=1.26,<3",
  "torch>=2.13,<2.14",
  "wandb>=0.18,<0.23",
]

[project.urls]
Homepage = "https://github.com/tsilva/env-Doom-turbo-torch"
Repository = "https://github.com/tsilva/env-Doom-turbo-torch.git"
Issues = "https://github.com/tsilva/env-Doom-turbo-torch/issues"
Changelog = "https://github.com/tsilva/env-Doom-turbo-torch/blob/main/CHANGES.md"

[dependency-groups]
dev = [
  "pip-audit>=2.9,<3",
  "pygame-ce>=2.5,<3",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "twine>=6.2,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
env_doom_turbo_torch = ["assets/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
